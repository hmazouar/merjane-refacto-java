version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: merjane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: merjane_db
      POSTGRES_USER: merjane_user
      POSTGRES_PASSWORD: merjane_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merjane_user -d merjane_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merjane-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/merjane_db
      SPRING_DATASOURCE_USERNAME: merjane_user
      SPRING_DATASOURCE_PASSWORD: merjane_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      LOG_LEVEL_ROOT: INFO
      LOG_LEVEL_APP: DEBUG
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
